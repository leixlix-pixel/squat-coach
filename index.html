<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>스쿼트 코치</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e1420; --card:#19212f; --card2:#222c3d; --line:#2c3749;
  --ink:#eaf0f8; --muted:#8a98ad;
  --go:#4ade80; --go-d:#22c55e; --down:#60a5fa; --rest:#fbbf24; --stop:#f87171;
}
html,body{height:100%}
body{
  font-family:'Noto Sans KR',-apple-system,sans-serif;
  background:var(--bg); color:var(--ink);
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
  overscroll-behavior:none;
}
#app{
  max-width:520px; margin:0 auto; min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);
}
.screen{flex:1; display:flex; flex-direction:column}
[hidden]{display:none !important}

button{font-family:inherit; color:inherit; border:none; background:none; cursor:pointer; font-size:16px}
.btn{
  min-height:56px; border-radius:16px; font-size:18px; font-weight:700;
  background:var(--card2); border:1px solid var(--line); width:100%;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--go-d); border-color:var(--go); color:#06240f; font-size:20px; font-weight:900}
.btn.ghost{background:transparent}
.btn.danger{background:transparent; border-color:#5b3238; color:var(--stop)}
.btn.sm{min-height:46px; font-size:15px; border-radius:12px}
.row{display:flex; gap:10px}

/* ---------- 홈 ---------- */
.title{font-size:30px; font-weight:900; letter-spacing:-.5px}
.title .dot{color:var(--go)}
.sub{color:var(--muted); font-size:14px; margin-top:6px; line-height:1.5}

.courses{display:flex; gap:9px; margin-top:16px}
.cs{
  flex:1; min-height:52px; border-radius:14px; background:var(--card);
  border:2px solid var(--line); color:var(--muted);
  display:flex; align-items:center; justify-content:center; gap:7px;
  font-size:16px; font-weight:700; letter-spacing:-.3px;
}
.cs .ce{font-size:19px; opacity:.5}
.cs.on{border-color:var(--go); background:#16271d; color:var(--ink)}
.cs.on .ce{opacity:1}

.levels{display:flex; flex-direction:column; gap:10px; margin-top:12px}
.lv{
  background:var(--card); border:2px solid var(--line); border-radius:16px;
  padding:14px 16px; display:flex; align-items:center; gap:14px; text-align:left; width:100%;
}
.lv.on{border-color:var(--go); background:#16271d}
.lv .mark{
  width:40px; height:40px; flex:0 0 40px; border-radius:12px; background:var(--card2);
  display:flex; align-items:center; justify-content:center; font-size:19px;
}
.lv.on .mark{background:var(--go-d); color:#06240f}
.lv .txt{display:block; flex:1; min-width:0}
.lv .nm{display:block; font-size:18px; font-weight:700; letter-spacing:-.3px}
.lv .nm .rp{font-size:14.5px; font-weight:500; color:#9fb0c6; margin-left:5px}
.lv .ds{display:block; font-size:13px; color:var(--muted); margin-top:3px}
.lv .tm{display:block; font-size:12px; color:#6f7d92; margin-top:3px}

.stats{display:flex; gap:10px; margin-top:18px}
.stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 6px; text-align:center}
.stat b{display:block; font-size:22px; font-weight:900; color:var(--go)}
.stat span{font-size:12px; color:var(--muted)}

.toggles{display:flex; gap:8px; margin-top:16px}
.tg{
  flex:1; min-height:46px; border-radius:12px; background:var(--card); border:1px solid var(--line);
  font-size:13px; font-weight:500; color:var(--muted); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px; line-height:1.2;
}
.tg.on{color:var(--ink); border-color:#3c4a61; background:var(--card2)}
.tg .ic{font-size:17px}
.tg.off .ic{opacity:.35}

.safety{
  margin-top:16px; font-size:12.5px; color:var(--muted); line-height:1.65;
  background:#1b1620; border:1px solid #3a2a30; border-radius:12px; padding:11px 13px;
}
.safety b{color:#f0a9a9}
.spacer{flex:1; min-height:14px}

/* ---------- 안내 ---------- */
.h2{font-size:21px; font-weight:900; margin-bottom:10px}
.guide-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; padding:0 4px}
.gh{font-size:17px; font-weight:900; color:#cfe9d8; margin:18px 0 9px; letter-spacing:-.3px}
.gh:first-child{margin-top:0}
.steps{display:flex; flex-direction:column; gap:9px}
.step{display:flex; gap:11px; background:var(--card); border-radius:13px; padding:12px 13px; font-size:15px; line-height:1.5}
.step i{
  flex:0 0 24px; height:24px; border-radius:8px; background:var(--go-d); color:#06240f;
  font-style:normal; font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center;
}
.badlist{margin-top:14px; background:#1b1620; border:1px solid #3a2a30; border-radius:13px; padding:13px}
.badlist .bt{font-size:14px; font-weight:700; color:#f0a9a9; margin-bottom:8px}
.badlist div.b{font-size:13.5px; color:#cbb9bd; line-height:1.6; padding-left:2px}
.figbox{display:flex; justify-content:center; gap:18px; margin:4px 0 14px}
.figbox.col{flex-direction:column; gap:10px}
.figbox .f{background:var(--card); border-radius:16px; padding:8px 4px 4px; width:46%}
.figbox.col .f{width:100%}
.figbox .f svg{display:block; width:100%; height:auto}
.figbox .f .cap{text-align:center; font-size:12px; color:var(--muted); padding-bottom:4px}

/* ---------- 운동 ---------- */
.wtop{display:flex; align-items:center; justify-content:space-between; font-size:14px; color:var(--muted); gap:8px}
.wtop .set{font-weight:700; color:var(--ink); font-size:15px; white-space:nowrap}
.wtop .clock{font-variant-numeric:tabular-nums; font-size:15px; font-weight:700; color:var(--ink)}

.stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:0; position:relative; overflow:hidden}
#figWrap{width:100%; flex:0 0 auto; height:min(40vh,300px); height:min(40dvh,300px); display:flex; align-items:center; justify-content:center}
#fig{height:100%; width:auto; max-width:100%; display:block}

.cue{font-size:27px; font-weight:900; letter-spacing:-.5px; margin-top:2px; min-height:38px; text-align:center}
.cue.down{color:var(--down)} .cue.up{color:var(--go)} .cue.hold{color:#c4b5fd} .cue.stay{color:#c4b5fd}

.big{font-size:clamp(54px,15vw,84px); font-weight:900; line-height:1; font-variant-numeric:tabular-nums}
.big small{font-size:24px; color:var(--muted); font-weight:700}
.ready .big{color:var(--rest)}
.staying .big{color:#c4b5fd}

.bar{width:100%; max-width:320px; height:9px; background:var(--card2); border-radius:9px; overflow:hidden; margin-top:12px}
.bar i{display:block; height:100%; background:var(--go); border-radius:9px; width:0; transition:width .12s linear}
.staying .bar i{background:#c4b5fd}
.tip{
  margin-top:14px; font-size:14.5px; color:var(--muted); text-align:center; line-height:1.5;
  background:var(--card); border-radius:12px; padding:11px 12px; width:100%;
}
.tip b{color:#cfe9d8; font-weight:500}
.wbtns{display:flex; gap:10px; margin-top:14px}
.wbtns .btn{flex:1}
.paused-veil{
  position:absolute; inset:0; background:rgba(14,20,32,.82); backdrop-filter:blur(2px);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border-radius:16px;
}
.paused-veil b{font-size:26px; font-weight:900; color:var(--rest)}
.paused-veil span{font-size:14px; color:var(--muted)}

/* ---------- 휴식 ---------- */
.restwrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px}
.restwrap .lab{font-size:17px; font-weight:700; color:var(--rest)}
.restwrap .num{font-size:108px; font-weight:900; color:var(--rest); line-height:1; font-variant-numeric:tabular-nums}
.restwrap .nxt{font-size:15px; color:var(--muted); margin-top:8px; text-align:center; line-height:1.6}
.ring{margin:6px 0}

/* ---------- 완료 ---------- */
.done-hero{text-align:center; padding:10px 0 4px}
.done-hero .em{font-size:54px}
.done-hero .ttl{font-size:25px; font-weight:900; margin-top:6px}
.done-hero .msg{font-size:14.5px; color:var(--muted); margin-top:8px; line-height:1.6}
.result{display:flex; gap:10px; margin-top:18px}
.result .r{flex:1; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 6px; text-align:center}
.result .r b{display:block; font-size:27px; font-weight:900; color:var(--go); font-variant-numeric:tabular-nums}
.result .r span{font-size:12px; color:var(--muted)}
.logline{margin-top:14px; font-size:13.5px; color:var(--muted); text-align:center; line-height:1.7}
.foot{font-size:11.5px; color:#5d6b80; text-align:center; margin-top:14px; line-height:1.6}
</style>
</head>
<body>
<div id="app">

<!-- ================= 홈 ================= -->
<section class="screen" id="sc-home">
  <div class="title">스쿼트 코치<span class="dot">.</span></div>
  <div class="sub" id="homeSub"></div>

  <div class="courses" id="courses"></div>
  <div class="levels" id="levels"></div>

  <div class="stats">
    <div class="stat"><b id="stV1">0</b><span id="stL1">오늘 횟수</span></div>
    <div class="stat"><b id="stV2">0</b><span id="stL2">이번 주</span></div>
    <div class="stat"><b id="stV3">0</b><span id="stL3">연속 일수</span></div>
  </div>

  <div class="toggles">
    <button class="tg" id="tgVoice" onclick="toggle('voice')"><span class="ic">🔊</span><span id="tgVoiceT">음성 안내</span></button>
    <button class="tg" id="tgBeep" onclick="toggle('beep')"><span class="ic">🎵</span><span id="tgBeepT">박자 소리</span></button>
    <button class="tg" id="tgVib" onclick="toggle('vib')"><span class="ic">📳</span><span id="tgVibT">진동</span></button>
  </div>

  <div class="spacer"></div>

  <div class="safety" id="homeSafety"></div>

  <div class="row" style="margin-top:12px">
    <button class="btn primary" onclick="goGuide()">시작하기</button>
  </div>
</section>

<!-- ================= 자세 안내 ================= -->
<section class="screen" id="sc-guide" hidden>
  <div class="h2" id="guideTitle">이렇게 하면 됩니다</div>
  <div class="guide-scroll" id="guideBody"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn ghost" style="flex:0 0 34%" onclick="goHome()">뒤로</button>
    <button class="btn primary" style="flex:1" onclick="startWorkout()" id="btnStart">준비됐어요</button>
  </div>
</section>

<!-- ================= 운동 중 ================= -->
<section class="screen" id="sc-workout" hidden>
  <div class="wtop">
    <span class="set" id="wSetLab">1세트</span>
    <span id="wLevel" style="font-size:13px"></span>
    <span class="clock" id="wClock">00:00</span>
  </div>

  <div class="stage" id="stage">
    <div id="figWrap"><svg viewBox="0 0 120 200" id="fig"></svg></div>
    <div class="cue" id="wCue">준비</div>
    <div class="big" id="wBig">0<small> / 15</small></div>
    <div class="bar"><i id="wBar"></i></div>
    <div class="tip" id="wTip"></div>
    <div class="paused-veil" id="veil" hidden><b>잠깐 멈춤</b><span>준비되면 계속하기를 누르세요</span></div>
  </div>

  <div class="wbtns">
    <button class="btn" id="btnPause" onclick="togglePause()">⏸ 잠깐 멈춤</button>
    <button class="btn danger" style="flex:0 0 32%" id="btnQuit" onclick="quitTap()">그만</button>
  </div>
</section>

<!-- ================= 휴식 ================= -->
<section class="screen" id="sc-rest" hidden>
  <div class="wtop">
    <span class="set" id="rDoneLab">1세트 완료</span>
    <span class="clock" id="rClock">00:00</span>
  </div>
  <div class="restwrap">
    <div class="lab">쉬는 시간</div>
    <svg class="ring" id="rRing" width="210" height="210" viewBox="0 0 210 210"></svg>
    <div class="nxt" id="rNext"></div>
    <div class="tip" id="rTip" style="max-width:340px"></div>
  </div>
  <div class="wbtns">
    <button class="btn" onclick="skipRest()">바로 시작 ▶</button>
    <button class="btn danger" style="flex:0 0 32%" onclick="quitTap()">그만</button>
  </div>
</section>

<!-- ================= 완료 ================= -->
<section class="screen" id="sc-done" hidden>
  <div class="spacer"></div>
  <div class="done-hero">
    <div class="em" id="dEmoji">🎉</div>
    <div class="ttl" id="dTitle">끝났습니다!</div>
    <div class="msg" id="dMsg"></div>
  </div>
  <div class="result">
    <div class="r"><b id="dV1">0</b><span id="dL1">한 횟수</span></div>
    <div class="r"><b id="dV2">0:00</b><span id="dL2">걸린 시간</span></div>
    <div class="r"><b id="dV3">0</b><span id="dL3">세트</span></div>
  </div>
  <div class="logline" id="dLog"></div>
  <div class="spacer"></div>
  <div class="row" style="margin-bottom:10px">
    <button class="btn primary" onclick="goGuide()">한 번 더</button>
  </div>
  <div class="row">
    <button class="btn ghost" onclick="goHome()">처음으로</button>
  </div>
  <div class="foot">기록은 이 폰 안에만 저장됩니다. 아무 데도 전송되지 않습니다.</div>
</section>

</div>

<script>
/* ===================== 동작 ===================== */
/* kind:'rep'  = 내렸다 올리는 왕복. up 이 끝나는 순간에만 센다.
   kind:'hold' = 그냥 버티는 것. 초를 센다.                        */
const EX = {
  squat: {
    name:'스쿼트', kind:'rep',
    cue(phase, rep){ return phase==='down' ? '천천히 앉기' : phase==='up' ? '밀고 올라오기' : '잠깐 멈춤'; },
    tips:['무릎이 발끝보다 앞으로 나가지 않게','엉덩이를 뒤로 빼면서 앉기','시선은 정면, 가슴은 펴고',
          '발뒤꿈치를 바닥에서 떼지 않기','무릎이 안쪽으로 모이지 않게','허리를 둥글게 말지 않기',
          '내려갈 때 들이마시고, 올라올 때 내쉬기','무게는 발바닥 가운데에','어깨에 힘을 빼고, 목은 길게',
          '급하게 튕기지 말고 같은 속도로']
  },
  plank: {
    name:'플랭크', kind:'hold',
    cue(){ return '버티기'; },
    tips:['엉덩이가 위로 솟지 않게','허리가 아래로 처지지 않게','시선은 손 앞 바닥에',
          '숨을 참지 말고 계속 쉬기','배에 힘을 주고 머리부터 발까지 한 줄로','힘들면 무릎을 바닥에 대세요']
  },
  deadbug: {
    name:'데드버그', kind:'rep',
    cue(phase, rep){
      const side = (rep % 2 === 0) ? '오른팔·왼다리' : '왼팔·오른다리';
      return phase==='down' ? side + ' 뻗기' : phase==='up' ? '천천히 돌아오기' : '잠깐 멈춤';
    },
    tips:['허리를 바닥에 붙인 채로','천천히, 같은 속도로','바닥에 닿기 직전까지만',
          '어깨는 바닥에 붙이고','뻗을 때 숨을 내쉬기','허리가 뜨면 덜 뻗어도 됩니다']
  }
};

/* ===================== 코스와 난이도 ===================== */
const COURSE = {
  squat: {
    key:'squat', name:'스쿼트', emoji:'🦵',
    sub:'화면만 보고 따라 하면 됩니다.<br>횟수는 소리로 세어 주고, 시간도 재 줍니다.',
    safety:'<b>무릎이나 허리가 아프면 바로 멈추세요.</b> 통증은 참는 게 아닙니다. ' +
           '아픈 날은 의자에 살짝 닿았다 일어나는 <b>의자 스쿼트</b>로 바꿔도 효과가 있습니다.',
    resttips:['허벅지 앞쪽을 가볍게 털어 주세요.','숨을 깊게 들이마시고 길게 내쉬세요.','물 한 모금 드세요.',
              '종아리를 쭉 늘려 주세요.','제자리에서 천천히 걸어 보세요.','무릎을 가볍게 흔들어 풀어 주세요.'],
    praise:['오늘 몫은 다 했습니다. 내일의 다리가 고마워할 겁니다.',
            '한 세트라도 한 사람과 안 한 사람은 다릅니다.',
            '숫자보다 중요한 건 어제도 했고 오늘도 했다는 것.',
            '허벅지가 뻐근하면 제대로 한 겁니다.',
            '이만큼 앉았다 일어났습니다. 충분합니다.'],
    levels: {
      easy:   {emoji:'🌱', name:'입문', ds:'한 번도 안 해 봤다면 여기부터', rest:60,
               moves:[{ex:'squat', reps:10, sets:2, down:2200, hold:400, up:1800}]},
      normal: {emoji:'💪', name:'보통', ds:'조금 숨이 차는 정도', rest:45,
               moves:[{ex:'squat', reps:15, sets:3, down:2000, hold:300, up:1500}]},
      hard:   {emoji:'🔥', name:'도전', ds:'끝나면 허벅지가 후들거립니다', rest:40,
               moves:[{ex:'squat', reps:20, sets:4, down:1800, hold:300, up:1300}]}
    }
  },
  core: {
    key:'core', name:'코어', emoji:'🧘',
    sub:'플랭크와 데드버그를 이어서 합니다.<br>스쿼트로는 배가 잘 안 쓰여서 따로 있습니다.',
    safety:'<b>허리가 아프면 바로 멈추세요.</b> 통증은 참는 게 아닙니다. ' +
           '힘든 날은 플랭크를 <b>무릎 대고</b> 하고, 데드버그는 <b>덜 뻗어도</b> 됩니다.',
    resttips:['배에 힘을 풀고 숨을 고르세요.','무릎을 가슴 쪽으로 당겨 허리를 풀어 주세요.','물 한 모금 드세요.',
              '손목을 가볍게 돌려 주세요.','엎드려서 숨을 길게 내쉬세요.','어깨를 크게 한 바퀴 돌려 주세요.'],
    praise:['코어는 티 안 나게 쌓입니다. 오늘도 쌓았습니다.',
            '배가 뻐근하면 제대로 한 겁니다.',
            '허리를 지키는 건 결국 배 힘입니다.',
            '짧아도 매일이 이깁니다.',
            '버틴 만큼 그대로 남습니다.'],
    levels: {

function todayKey(d){
  d = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function mondayKey(){
  const d = new Date();
  const diff = (d.getDay() + 6) % 7;       // 월=0
  d.setDate(d.getDate() - diff);
  return todayKey(d);
}
function streakDays(list){
  const days = new Set(list.map(r => r.date));
  if(!days.size) return 0;
  const d = new Date();
  if(!days.has(todayKey(d))) d.setDate(d.getDate()-1);   // 오늘 안 했으면 어제부터 센다
  let n = 0;
  while(days.has(todayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

  const put = (i, v, lab) => { el('stV'+i).textContent = v; el('stL'+i).textContent = lab; };
  if(S.course === 'core'){
    let sec = 0, reps = 0;
    for(const r of list) if(isCore(r) && r.date === tk){ sec += (r.plankSec||0); reps += (r.reps||0); }
    put(1, sec, '오늘 플랭크(초)');
    put(2, reps, '오늘 데드버그');
  }else{
    let today = 0, week = 0;
    for(const r of list){
      if(isCore(r)) continue;
      if(r.date === tk) today += r.reps;
      if(r.date >= mk) week += r.reps;
    }
    put(1, today, '오늘 횟수');
    put(2, week, '이번 주');
  }
  put(3, streakDays(list), '연속 일수');      // 어느 코스든 한 날은 센다
}

let AC = null;
function audioOn(){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
  }catch(e){ AC = null; }
}
function tone(f1, f2, dur, vol){
  if(!cfg.beep || !AC) return;
  try{
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f1, t);
    if(f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
function sndDown(){ tone(760, 380, 0.22); }
function sndUp(){ tone(380, 820, 0.22); }
function sndCount(){ tone(1180, 1180, 0.07, 0.22); }
function sndTick(){ tone(700, 700, 0.06, 0.18); }
function sndSetEnd(){ tone(520,520,0.12); setTimeout(()=>tone(700,700,0.14),130); }
function sndFinish(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f,0.25,0.28), i*150)); }

let voiceKo = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices() || [];
    voiceKo = vs.find(v => /^ko/i.test(v.lang)) || null;
  }catch(e){}
}
function say(text, force){
  if(!cfg.voice && !force) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 1.15; u.pitch = 1.0; u.volume = 1;
    if(voiceKo) u.voice = voiceKo;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ===================== 스틱 피겨 =====================
   동작마다 관절 좌표 두 벌(a=시작, b=끝)을 t 로 보간해서 그린다.
   좌표를 손볼 때는 팔·다리 길이가 두 자세에서 거의 같아야 한다. */
const FIG = {
  squat: {
    vb:'0 0 120 200', floor:'M8 184 H112', headR:11.5,
    a:{head:[60,28],neck:[60,40],shoulder:[60,52],hip:[60,100],knee:[60,140],ankle:[60,178],heel:[49,179],toe:[82,179],hand:[67,92]},
    b:{head:[48,64],neck:[47,75],shoulder:[45,87],hip:[40,136],knee:[80,146],ankle:[60,178],heel:[49,179],toe:[82,179],hand:[82,78]},
    bones:[['shoulder','hand',6],['neck','hip',8],['hip','knee',8],['knee','ankle',8],['heel','toe',6]]
  },
  /* 엎드려 버티기 — 움직이지 않으므로 b 가 없다 */
  plank: {
    vb:'0 0 200 120', floor:'M8 104 H192', headR:11,
    a:{head:[30,56],neck:[44,62],shoulder:[56,66],elbow:[56,100],hand:[26,100],
       hip:[110,76],knee:[146,86],ankle:[176,96],toe:[186,101]},
    bones:[['hand','elbow',6],['elbow','shoulder',7],['neck','hip',8],['hip','knee',8],['knee','ankle',8],['ankle','toe',6]]
  },
  /* 누워서 한쪽 팔과 반대쪽 다리 뻗기 */
  deadbug: {
    vb:'0 0 200 120', floor:'M8 104 H192', headR:11,
    a:{head:[20,88],neck:[34,93],shoulder:[46,96],hip:[98,100],hand:[46,44],knee:[98,50],ankle:[142,50]},
    b:{head:[20,88],neck:[34,93],shoulder:[46,96],hip:[98,100],hand:[4,66],knee:[147,91],ankle:[190,83]},
    bones:[['shoulder','hand',7],['neck','hip',8],['hip','knee',8],['knee','ankle',8]]
  }
};
function figureSVG(key, t, color){
  const F = FIG[key], A = F.a, B = F.b || F.a, p = {};
  for(const j in A){
    const a = A[j], b = B[j] || a;
    p[j] = [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t];
  }
  const L = (a,b,w) => '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke-width="'+w+'"/>';
  return '<path d="'+F.floor+'" stroke="#2c3749" stroke-width="3" stroke-linecap="round" fill="none"/>' +
    '<g stroke="'+color+'" stroke-linecap="round" fill="none">' +
      F.bones.map(b => L(p[b[0]], p[b[1]], b[2])).join('') +
    '</g>' +
    '<circle cx="'+p.head[0].toFixed(1)+'" cy="'+p.head[1].toFixed(1)+'" r="'+F.headR+'" fill="'+color+'"/>';
}
function figTag(key, t, color, cap){
  return '<div class="f"><svg viewBox="'+FIG[key].vb+'">' + figureSVG(key, t, color) + '</svg>' +
         '<div class="cap">'+cap+'</div></div>';
}

/* 난이도 카드 한 장에 들어갈 요약 */
function moveLabel(m){
  return EX[m.ex].name + ' ' + (m.secs ? m.secs + '초' : m.reps + '회');
}
function levelSum(lv){ return lv.moves.map(m => moveLabel(m) + ' × ' + m.sets).join(' · '); }
function levelBlocks(lv){ let n = 0; for(const m of lv.moves) n += m.sets; return n; }
function levelSecs(lv){
  let ms = 0;
  for(const m of lv.moves){
    const per = m.secs ? m.secs*1000 : m.reps*(m.down + m.hold + m.up);
    ms += per * m.sets;
  }
  const n = levelBlocks(lv);
  ms += 3100*n + lv.rest*1000*(n-1);
  return Math.round(ms/1000);
}
function renderLevels(){
  const c = CO(), sq = (S.course === 'squat');
  el('levels').innerHTML = Object.keys(c.levels).map(k => {

    const rp = sq ? (v.moves[0].reps + '회 × ' + v.moves[0].sets + '세트') : (levelBlocks(v) + '세트');
    const tm = '약 ' + mm + '분 · ' + (sq ? ('세트 사이 ' + v.rest + '초 휴식') : levelSum(v));
    return '<button class="lv '+(S.level===k?'on':'')+'" onclick="pickLevel(\''+k+'\')">'+

/* ===================== 운동 진행 =====================
   난이도 하나를 「덩어리(block)」의 줄로 펴서 순서대로 돈다.
   스쿼트 코스는 덩어리가 전부 스쿼트라 예전과 똑같이 보인다. */
function buildPlan(lv){
  const plan = [];
  for(const m of lv.moves){
    for(let i = 1; i <= m.sets; i++){
      plan.push({ex:m.ex, kind:EX[m.ex].kind, reps:m.reps||0, secs:m.secs||0,
                 down:m.down||0, hold:m.hold||0, up:m.up||0, i:i, n:m.sets, rest:lv.rest});
    }
  }
  return plan;
}
function blkLabel(b){
  return (S.course === 'squat') ? (b.i + '세트')
       : (EX[b.ex].name + ' ' + b.i + '/' + b.n);
}
function blkSay(b){
  return (S.course === 'squat') ? (b.i + '세트') : moveLabel(b);
}

function startWorkout(){
  audioOn(); pickVoice(); keepAwake();
  const v = LEV();
  S.plan = buildPlan(v);
  S.bi = 0; S.rep = 0; S.totalReps = 0; S.plankSec = 0; S.elapsed = 0;
  S.paused = false; S.quitArmed = 0; S.tipIdx = 0;
  el('wLevel').textContent = v.emoji + ' ' + v.name;
  el('veil').hidden = true;
  el('btnPause').textContent = '⏸ 잠깐 멈춤';
  el('btnQuit').textContent = '그만';
  show('workout');
  beginBlock(true);
}
function beginBlock(first){
  const b = BLK();
  S.rep = 0;
  show('workout');                       // 휴식에서 돌아올 때 반드시 필요
  el('wSetLab').textContent = blkLabel(b);
  el('fig').setAttribute('viewBox', FIG[b.ex].vb);
  el('stage').classList.add('ready');
  el('stage').classList.toggle('staying', b.kind === 'hold');
  setPhase('ready', 3100);
  S.lastShown = -1;
  S.tipIdx = Math.floor(Math.random() * EX[b.ex].tips.length);
  showTip();
  say((first ? '준비하세요. ' : '') + blkSay(b) + ' 시작합니다');
  renderWorkout();
}
function setPhase(p, dur){
  const b = BLK();
  S.phase = p;
  S.phaseDur = (dur != null) ? dur :
    (p==='down' ? b.down : p==='hold' ? b.hold : p==='up' ? b.up : p==='stay' ? b.secs*1000 : 0);
  S.phaseLeft = S.phaseDur;
  if(p==='down'){ sndDown(); }
  if(p==='up'){ sndUp(); }
}
function showTip(){
  const t = EX[BLK().ex].tips;
  el('wTip').innerHTML = '<b>' + t[S.tipIdx % t.length] + '</b>';
}
function nextTip(){ S.tipIdx++; showTip(); }

function endBlock(){
  const b = BLK();
  if(b.kind === 'hold') S.plankSec += b.secs;
  sndSetEnd(); buzz([0,70,60,70]);
  if(S.bi + 1 >= S.plan.length){ finish(); return; }
  const doneLab = blkLabel(b);
  S.bi++;
  const nx = BLK();
  el('rDoneLab').textContent = doneLab + ' 완료';
  el('rNext').innerHTML = '다음은 <b style="color:#eaf0f8">' + blkSay(nx) + '</b>입니다.';
  const rt = CO().resttips;
  el('rTip').textContent = rt[Math.floor(Math.random()*rt.length)];
  S.phase = 'rest'; S.phaseDur = b.rest*1000; S.phaseLeft = S.phaseDur;
  S.lastShown = -1;
  show('rest');
  setTimeout(() => say(doneLab + ' 완료. ' + b.rest + '초 쉬세요'), 650);
  renderRest();
}
function skipRest(){ if(S.screen==='rest'){ S.phaseLeft = 0; } }

function finish(){
  releaseLock();
  const secs = Math.round(S.elapsed/1000);
  const core = (S.course === 'core');
  const list = loadLog();
  list.push({date: todayKey(), course: S.course, reps: S.totalReps, plankSec: S.plankSec,
             seconds: secs, level: S.level, sets: S.plan.length});
  saveLog(list);

  const put = (i, v, lab) => { el('dV'+i).textContent = v; el('dL'+i).textContent = lab; };
  if(core){
    put(1, S.plankSec + '초', '플랭크');
    put(2, S.totalReps + '회', '데드버그');
    put(3, fmt(secs*1000), '걸린 시간');
  }else{
    put(1, S.totalReps, '한 횟수');
    put(2, fmt(secs*1000), '걸린 시간');
    put(3, S.plan.length, '세트');
  }
  const pr = CO().praise;
  el('dMsg').textContent = pr[Math.floor(Math.random()*pr.length)];
  el('dEmoji').textContent = ['🎉','👏','🔥','💪','✨'][Math.floor(Math.random()*5)];

  const tk = todayKey();
  let today = 0, todaySec = 0;
  for(const r of list) if(r.date===tk && isCore(r)===core){ today += (r.reps||0); todaySec += (r.plankSec||0); }
  const st = streakDays(list);
  const sum = core ? ('오늘 누적 플랭크 <b style="color:#eaf0f8">' + todaySec + '초</b> · 데드버그 <b style="color:#eaf0f8">' + today + '회</b>')
                   : ('오늘 누적 <b style="color:#eaf0f8">' + today + '회</b>');
  el('dLog').innerHTML = sum + (st > 1 ? ' · <b style="color:#4ade80">' + st + '일 연속</b>' : '');

  sndFinish(); buzz([0,90,70,90,70,140]);
  const spoken = core ? ('끝났습니다. 플랭크 ' + S.plankSec + '초, 데드버그 ' + S.totalReps + '개 했습니다. 수고했어요')
                      : ('끝났습니다. 오늘 ' + S.totalReps + '개 했습니다. 수고했어요');
  setTimeout(() => say(spoken), 700);
  show('done');
}

function togglePause(){
  S.paused = !S.paused;
  el('veil').hidden = !S.paused;
  el('btnPause').textContent = S.paused ? '▶ 계속하기' : '⏸ 잠깐 멈춤';
  if(S.paused){ try{ speechSynthesis.cancel(); }catch(e){} }
  buzz(20);
}
function quitTap(){
  const now = Date.now();
  if(S.quitArmed && now - S.quitArmed < 3000){ goHome(); return; }
  S.quitArmed = now;
  const b = el('btnQuit');
  if(b) b.textContent = '정말?';
  setTimeout(() => { if(Date.now() - S.quitArmed >= 2900 && el('btnQuit')) el('btnQuit').textContent = '그만'; }, 3000);
}
function stopAll(){
  S.paused = false;
  try{ speechSynthesis.cancel(); }catch(e){}
}

/* ===================== 그리기 ===================== */
function fmt(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
function ease(x){ return x < .5 ? 2*x*x : 1 - 2*(1-x)*(1-x); }

function phaseT(){
  const prog = S.phaseDur ? 1 - (S.phaseLeft / S.phaseDur) : 0;
  const p = Math.min(1, Math.max(0, prog));
  if(S.phase === 'down') return ease(p);
  if(S.phase === 'hold') return 1;
  if(S.phase === 'up')   return 1 - ease(p);
  return 0;                                    // ready · stay 는 시작 자세 그대로
}
function renderWorkout(){
  const b = BLK();
  const color = S.phase === 'down' ? '#60a5fa' : S.phase === 'up' ? '#4ade80'
              : (S.phase === 'hold' || S.phase === 'stay') ? '#c4b5fd' : '#8a98ad';
  el('fig').innerHTML = figureSVG(b.ex, phaseT(), color);

  const cue = el('wCue');
  cue.className = 'cue ' + (S.phase === 'ready' ? '' : S.phase);
  if(S.phase === 'ready'){
    const n = Math.ceil(S.phaseLeft/1000);
    cue.textContent = '준비하세요';
    el('wBig').innerHTML = (n > 0 ? n : '시작') + '';
    el('wBar').style.width = '0%';
    if(n !== S.lastShown && n > 0 && n <= 3){ S.lastShown = n; sndTick(); say(String(n)); }
  }else if(b.kind === 'hold'){
    el('stage').classList.remove('ready');
    cue.textContent = EX[b.ex].cue(S.phase, S.rep);
    const left = Math.ceil(S.phaseLeft/1000);
    el('wBig').innerHTML = (left > 0 ? left : 0) + '<small> 초</small>';
    el('wBar').style.width = Math.round((1 - S.phaseLeft/S.phaseDur) * 100) + '%';
    if(left !== S.lastShown){
      const prev = S.lastShown;
      S.lastShown = left;
      if(left <= 5 && left > 0){ sndTick(); buzz(15); }
      if(left === 10 && b.secs > 14) say('10초 남았습니다');
      if(prev > 0 && (b.secs - left) > 0 && (b.secs - left) % 10 === 0) nextTip();
    }
  }else{
    el('stage').classList.remove('ready');
    cue.textContent = EX[b.ex].cue(S.phase, S.rep);
    el('wBig').innerHTML = S.rep + '<small> / ' + b.reps + '</small>';
    el('wBar').style.width = Math.round(S.rep / b.reps * 100) + '%';
  }
  el('wClock').textContent = fmt(S.elapsed);
}
function ringSVG(frac, left){
  const R = 92, C = 2*Math.PI*R;
  return '<circle cx="105" cy="105" r="'+R+'" fill="none" stroke="#222c3d" stroke-width="12"/>' +
    '<circle cx="105" cy="105" r="'+R+'" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" ' +
    'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-frac)).toFixed(1)+'" transform="rotate(-90 105 105)"/>' +
    '<text x="105" y="105" text-anchor="middle" dominant-baseline="central" fill="#fbbf24" ' +
    'font-family="Noto Sans KR,sans-serif" font-size="74" font-weight="900">'+left+'</text>';
}
function renderRest(){
  const left = Math.ceil(S.phaseLeft/1000);
  const frac = S.phaseDur ? S.phaseLeft/S.phaseDur : 0;
  el('rRing').innerHTML = ringSVG(Math.max(0,Math.min(1,frac)), left > 0 ? left : 0);
  el('rClock').textContent = fmt(S.elapsed);
  if(left !== S.lastShown){
    S.lastShown = left;
    if(left <= 5 && left > 0){ sndTick(); buzz(15); }
    if(left === 10) say('10초 남았습니다');
  }
}

/* ===================== 메인 루프 ===================== */
let last = 0;
function tick(now){
  requestAnimationFrame(tick);
  const dt = last ? Math.min(now - last, 200) : 0;
  last = now;
  if(S.screen !== 'workout' && S.screen !== 'rest') return;
  if(S.paused) return;

  S.elapsed += dt;
  S.phaseLeft -= dt;

  if(S.screen === 'rest'){
    renderRest();
    if(S.phaseLeft <= 0) beginBlock(false);
    return;
  }

  const b = BLK();
  if(S.phase === 'ready'){
    if(S.phaseLeft <= 0){ say('시작'); setPhase(b.kind === 'hold' ? 'stay' : 'down'); S.lastShown = -1; }
  }else if(S.phase === 'stay'){
    if(S.phaseLeft <= 0){ endBlock(); return; }
  }else if(S.phase === 'down'){
    if(S.phaseLeft <= 0) setPhase(b.hold > 0 ? 'hold' : 'up');
  }else if(S.phase === 'hold'){
    if(S.phaseLeft <= 0) setPhase('up');
  }else if(S.phase === 'up'){
    if(S.phaseLeft <= 0){
      S.rep++; S.totalReps++;
      sndCount(); buzz(25);
      say(KNUM[S.rep-1] || String(S.rep));
      if(S.rep % 5 === 0) nextTip();
      if(S.rep >= b.reps){ endBlock(); return; }
      setPhase('down');
    }
  }
  renderWorkout();
}

/* ===================== 시작 ===================== */
document.addEventListener('visibilitychange', () => {
  if(document.hidden && (S.screen==='workout') && !S.paused) togglePause();
});
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();
}
loadCfg();
renderHome();
requestAnimationFrame(tick);
</script>
